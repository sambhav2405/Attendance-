<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Games Zone</title>
<meta name="theme-color" content="#4f46e5">

<!-- Google AdSense (same publisher account as the main site) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7200179743941578" crossorigin="anonymous"></script>

<link rel="icon" type="image/jpeg" href="unnamed.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(-45deg, #000428, #004e92, #6a11cb, #2b0854);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: #eef2f7;
        min-height: 100vh;
        margin: 0;
        padding: 18px 14px 40px;
    }
    @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .wrap { max-width: 1100px; margin: 0 auto; }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .back-link { color: #cbd5e1; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 20px; }
    .back-link:hover { background: rgba(255,255,255,0.15); }
    h1 { font-size: 1.8rem; font-weight: 800; margin: 10px 0 2px; display:flex; align-items:center; gap:10px; }
    h1 i { color: #fbbf24; }
    .sub { color: #94a3b8; margin: 0 0 20px; font-size: 0.92rem; }

    .ad-slot { background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.18); border-radius: 12px; min-height: 90px; display: flex; align-items: center; justify-content: center; margin: 18px 0; overflow: hidden; }
    .ad-slot .ad-hint { color: #64748b; font-size: 0.75rem; }

    .hero-card {
        background: linear-gradient(135deg, rgba(124,58,237,0.35), rgba(37,99,235,0.3));
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 20px; padding: 22px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
        margin-bottom: 8px;
    }
    .hero-card .icon-badge { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg,#f59e0b,#ef4444); display:flex; align-items:center; justify-content:center; font-size: 1.8rem; flex-shrink: 0; }
    .hero-card .info { flex: 1; min-width: 200px; }
    .hero-card h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .hero-card p { margin: 0; color: #cbd5e1; font-size: 0.85rem; }
    .play-btn { background: linear-gradient(135deg,#f59e0b,#ef4444); color: #fff; font-weight: 700; border: none; padding: 12px 24px; border-radius: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; white-space: nowrap; }
    .play-btn:hover { filter: brightness(1.08); }

    .section-title { font-size: 1.1rem; font-weight: 700; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; color: #f1f5f9; }
    .section-title .tag { font-size: 0.68rem; font-weight: 600; background: rgba(251,191,36,0.18); color: #fbbf24; padding: 2px 9px; border-radius: 10px; }

    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .game-card {
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
        overflow: hidden; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
        display: flex; flex-direction: column;
    }
    .game-card:hover { transform: translateY(-3px); border-color: rgba(251,191,36,0.5); }
    .game-card .thumb {
        aspect-ratio: 4/3; background: linear-gradient(135deg, #1e293b, #334155);
        display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #475569; position: relative;
    }
    .game-card .thumb .play-overlay {
        position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center;
        opacity: 0; transition: opacity 0.15s; font-size: 1.6rem; color: #fbbf24;
    }
    .game-card:hover .play-overlay { opacity: 1; }
    .game-card .label { padding: 9px 10px; }
    .game-card .label .name { font-size: 0.82rem; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-card .label .cat { font-size: 0.68rem; color: #94a3b8; }

    .player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 14px; }
    .player-overlay.open { display: flex; }
    .player-frame-wrap { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
    .player-frame-wrap iframe { width: 100%; height: 100%; border: 0; }
    .player-close { align-self: flex-end; max-width: 900px; width: 100%; text-align: right; margin-bottom: 8px; }
    .player-close button { background: rgba(255,255,255,0.12); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
    .player-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height:100%; color:#94a3b8; text-align:center; padding: 20px; }
    .player-placeholder i { font-size: 2.2rem; color: #f59e0b; }

    .empty-note { grid-column: 1 / -1; text-align: center; color: #64748b; font-size: 0.82rem; padding: 24px; border: 1px dashed rgba(255,255,255,0.15); border-radius: 12px; }

    footer { text-align: center; color: #475569; font-size: 0.75rem; margin-top: 34px; }
</style>
</head>
<body>

<div class="wrap">
    <div class="top-row">
        <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i> Attendance app</a>
    </div>
    <h1><i class="fas fa-gamepad"></i> Games Zone</h1>
    <p class="sub">Free browser games — kuch click karo aur seedha khelna shuru karo.</p>

    <!-- Ad slot: top banner. Create a "Display ad" unit in AdSense, copy its data-ad-slot number here. -->
    <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block; width:100%;"
             data-ad-client="ca-pub-7200179743941578"
             data-ad-slot="0000000000"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>

    <div class="hero-card">
        <div class="icon-badge"><i class="fas fa-flag-checkered"></i></div>
        <div class="info">
            <h2>Desi Kart Battle 3D</h2>
            <p>Apna khud ka 3D multiplayer kart racing + battle arena game — dosto ke saath live khelo.</p>
        </div>
        <a class="play-btn" id="kartBattleLink" href="#" target="_blank" rel="noopener">
            <i class="fas fa-play"></i> Play Now
        </a>
    </div>

    <div class="section-title">More Games <span class="tag">HTML5</span></div>
    <div class="games-grid" id="gdGrid"></div>

    <!-- Ad slot: mid-page banner -->
    <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block; width:100%;"
             data-ad-client="ca-pub-7200179743941578"
             data-ad-slot="0000000001"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>

    <footer>Games powered by their respective creators / GameDistribution.com</footer>
</div>

<div class="player-overlay" id="playerOverlay">
    <div class="player-close"><button id="playerCloseBtn"><i class="fas fa-times"></i> Close</button></div>
    <div class="player-frame-wrap" id="playerFrameWrap"></div>
</div>

<script>
// ===== 1) Your own multiplayer game =====
// Once deployed (see 3d-kart-battle/README.md - Render section), replace this with the live URL,
// e.g. "https://desi-kart-battle-3d.onrender.com"
const KART_BATTLE_URL = "https://desi-kart-battle-3d.onrender.com";
document.getElementById('kartBattleLink').href = KART_BATTLE_URL;

// ===== 2) GameDistribution catalog games =====
// Sign up free at https://gamedistribution.com -> Publisher dashboard -> pick games -> copy each
// game's ID (a GUID like "01a2b3c4-....") and paste it below. Leave gdId empty for a "coming soon" card.
// icon: any Font Awesome class shown until you add a real thumbnail image (thumb: "url").
const GD_GAMES = [
    { name: "Racing Game", cat: "Racing", gdId: "", icon: "fa-car" },
    { name: "Puzzle Game", cat: "Puzzle", gdId: "", icon: "fa-puzzle-piece" },
    { name: "Action Game", cat: "Action", gdId: "", icon: "fa-fist-raised" },
    { name: "Arcade Game", cat: "Arcade", gdId: "", icon: "fa-star" },
    { name: "Sports Game", cat: "Sports", gdId: "", icon: "fa-futbol" },
    { name: "Shooting Game", cat: "Shooter", gdId: "", icon: "fa-crosshairs" },
];

const grid = document.getElementById('gdGrid');
const overlay = document.getElementById('playerOverlay');
const frameWrap = document.getElementById('playerFrameWrap');

function openPlayer(game) {
    frameWrap.innerHTML = '';
    if (game.gdId) {
        const iframe = document.createElement('iframe');
        iframe.src = `https://html5.gamedistribution.com/${game.gdId}/`;
        iframe.allow = 'autoplay; fullscreen; gamepad';
        iframe.setAttribute('allowfullscreen', '');
        frameWrap.appendChild(iframe);
    } else {
        frameWrap.innerHTML = `<div class="player-placeholder">
            <i class="fas fa-tools"></i>
            <div><b>${game.name}</b> jald aa raha hai!</div>
            <div style="font-size:0.78rem;">GameDistribution.com se is game ka ID lekar <code>games.html</code> ki <code>GD_GAMES</code> list me daal do.</div>
        </div>`;
    }
    overlay.classList.add('open');
}
document.getElementById('playerCloseBtn').addEventListener('click', () => {
    overlay.classList.remove('open');
    frameWrap.innerHTML = '';
});

if (GD_GAMES.length === 0) {
    grid.innerHTML = '<div class="empty-note">Abhi koi game add nahi hua. GameDistribution.com se signup karke games ki list yahan add karo.</div>';
} else {
    GD_GAMES.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <div class="thumb">
                <i class="fas ${game.icon}"></i>
                <div class="play-overlay"><i class="fas fa-play-circle"></i></div>
            </div>
            <div class="label">
                <span class="name">${game.name}</span>
                <span class="cat">${game.cat}</span>
            </div>`;
        card.addEventListener('click', () => openPlayer(game));
        grid.appendChild(card);
    });
}

try { (adsbygoogle = window.adsbygoogle || []).push({}); (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
</script>

</body>
</html>
